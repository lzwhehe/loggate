# LogGate example configuration (M5).
# Only implemented keys are accepted; unknown keys are rejected.
node_id: gw-1
data_dir: ./data          # wal/, state.db (bbolt: L1, ckpt, registry), dlq/

wal:
  segment_bytes: 64MiB     # roll threshold
  fsync_interval: 10ms     # group commit: wait at most this long for more events
  fsync_max_events: 512    # ...or fsync as soon as a batch holds this many

ingest:
  http:
    listen: "127.0.0.1:8080"
    max_body: 1MiB
    # Bearer tokens bind requests to a SourceID ("http:<source>").
    # With no tokens, every request is accepted as "http:anonymous".
    # tokens:
    #   - { source: app1, token_env: LOGGATE_TOKEN_APP1 }

idempotency:
  # HMAC key (>= 16 bytes) for gateway-assigned idem keys. If the variable
  # is unset, a random per-process key is used.
  key_env: LOGGATE_IDEM_KEY

retry:
  base: 200ms              # full jitter: rand[0, min(max, base*2^(n-1)))
  max: 30s
  max_attempts: 20         # real send attempts; QueueFull/BreakerOpen/NotActive do not count
  max_age: 24h             # measured from received_at
  redeliver_share: 0.5     # L2 share reserved for redelivery while a backlog exists (>= 0.2)
  redeliver_interval: 200ms

l1:
  checkpoint_interval: 1s
  orphan_ttl: 24h          # parked events of absent/unregistered destinations -> DLQ
  max_records_per_dest: 1000000
  on_quota: block_all      # block_all (HTTP 429) | dlq_overflow
  sweep_interval: 1s
  gc_interval: 10s
  tombstone_ttl: 24h       # a removed destination's ID is not reused before this

# Disk quota over everything in data_dir (WAL + state.db + DLQ). While usage
# exceeds max_bytes, ingest answers 429 + Retry-After. 0 = unlimited.
disk:
  max_bytes: 0
  check_interval: 1s

# Management plane.
#  - token/token_env: token-protected admin API
#    (POST /v1/admin/{register,unregister,shutdown}); disabled unless a
#    token (>= 16 bytes) is configured.
#  - metrics: Prometheus GET /metrics listen address (default ":9091").
#  - ui: read-only web dashboard GET /ui/ (default ":8081").
#  "off" disables a listener.
admin:
  # token_env: LOGGATE_ADMIN_TOKEN
  metrics: "127.0.0.1:9091"
  ui: "127.0.0.1:8081"

# PII masking (DESIGN §7). Runs before the WAL append: unmasked PII never
# reaches disk. Every field not listed is "scan"ned (raw_data and unmapped
# included); masking errors replace the value with "[REDACTED:error]".
masking:
  hmac_key_env: LOGGATE_HMAC_KEY   # key for "hash" (>= 16 bytes); unset = random per process
  default: scan                    # scan | drop (fail-closed for unknown fields) | keep | hash | mask
  detectors: [id_card, bank_card, phone, email]
  bank_bins: ["62", "4", "51-55", "2221-2720", "34", "37", "35"]   # BIN prefix AND Luhn required
  fields:
    user.name: hash
    src_endpoint.ip: keep
  # Labels, not legal determinations (GB/T 43697 depends on scale and use).
  levels:
    pii.id_card: general
    pii.bank_card: general
    pii.phone: general
    pii.email: general
    "combo:id_card+bank_card": important

destinations:
  - name: archive
    type: file             # not idempotent: exposes the raw duplicate rate
    queue: { max_events: 10000, max_bytes: 64MiB }
    config: { path: ./out/archive.jsonl }
  - name: siem
    type: sqlite           # idempotent: INSERT ... ON CONFLICT(idem_key) DO NOTHING
    max_level: important   # events labelled above this are not delivered here
    breaker: { failures: 5, open_for: 10s }
    config: { path: ./out/siem.db }
  # - name: soar
  #   type: webhook
  #   breaker: { failures: 5, open_for: 10s }
  #   config: { url: "http://127.0.0.1:9100/ingest", timeout: 2s, batch: true }

# First matching route wins; match = equality on a top-level OCSF field
# (class_uid, activity_id, ...) or else a top-level key of the ingested
# JSON object (fields.unmapped). Naming an unconfigured destination reserves its ID
# and parks its events until it is configured or orphan_ttl expires.
routes:
  - { match: { class_uid: 3002 }, to: [archive, siem] }
  - { match: {}, to: [archive] }
